application:
  name: EvalWeave
  version: 0.1.0
  debug: true

server:
  host: 0.0.0.0
  port: 8000
  reload: true

database:
  url: "mysql+pymysql://evalweave:evalweave@127.0.0.1:3306/evalweave?charset=utf8mb4"
  echo: false
  pool_size: 10
  max_overflow: 20
  pool_recycle: 3600

redis:
  url: "redis://127.0.0.1:6379/0"

celery:
  broker_url: "redis://127.0.0.1:6379/1"
  result_backend: "redis://127.0.0.1:6379/2"
  timezone: Asia/Shanghai
  task_time_limit: 600
  worker_concurrency: 4

storage:
  type: local
  local_directory: ./data/storage

logging:
  level: INFO
  format: console
  directory: ./logs

evaluation:
  default_timeout_seconds: 60
  default_concurrency: 5
  max_file_size_mb: 50
  allowed_extensions:
    - json
    - jsonl
    - csv
    - xlsx

agent:
  enabled: false
  api_mode: responses
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: ""
  timeout_seconds: 120
  max_repair_attempts: 3
  dry_run_cases: 5
  require_approval: true
  allowed_target_hosts: []
  target_headers: {}

notifications:
  platform_base_url: "http://127.0.0.1:5173"
  wecom:
    enabled: false
    webhook_url: ""
    timeout_seconds: 10
  email:
    enabled: false
    host: ""
    port: 465
    username: ""
    password: ""
    from_address: ""
    use_ssl: true
    starttls: false
    timeout_seconds: 10

auth:
  jwt_secret: "replace-with-a-random-secret-at-least-32-characters"
  token_expire_minutes: 480
  cookie_name: evalweave_session
  cookie_secure: false
  allow_registration: true
  bootstrap_admin:
    enabled: true
    username: admin
    password: change-me-now
