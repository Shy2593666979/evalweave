[project]
name = "evalweave"
version = "0.1.0"
description = "Open-source evaluation and tracing platform for AI applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "EvalWeave Contributors" },
]
dependencies = [
  "celery[redis]>=5.4",
  "cryptography>=46.0",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=3.13.0",
  "openpyxl>=3.1",
  "pydantic>=2.10",
  "pwdlib[argon2]>=0.3",
  "pyjwt>=2.10",
  "pymysql>=1.1",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "redis>=5.2",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
evalweave = "evalweave.cli:main"
evalweave-api = "evalweave.main:api_main"
evalweave-worker = "evalweave.workers.app:worker_main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
